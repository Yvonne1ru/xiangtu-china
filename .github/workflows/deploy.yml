name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 最新版已支持 Node.js 24

      - name: Setup Node.js
        uses: actions/setup-node@v4  # 最新版已支持 Node.js 24
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build with Next.js
        run: npm run build

      - name: Deploy to yvonne1ru.github.io
        uses: peaceiris/actions-gh-pages@v4  # 👈 从 v3 升级到 v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Yvonne1ru/yvonne1ru.github.io
          publish_dir: ./out
          publish_branch: main
          force_orphan: true