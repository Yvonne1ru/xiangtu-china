name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # 需要写入权限来推送代码

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build with Next.js
        run: npm run build

      - name: Deploy to yvonne1ru.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          # 使用你配置的 DEPLOY_TOKEN
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          # 关键：推送到外部仓库
          external_repository: Yvonne1ru/yvonne1ru.github.io
          publish_dir: ./out
          publish_branch: main
          # 强制覆盖，避免历史冲突
          force_orphan: true